name = "pandora-sync"
main = "sync.js"
compatibility_date = "2026-06-01"

# KV: story packs + play saves backup/sync
# (namespace id filled in after `wrangler kv namespace create PANDORA_KV`)
[[kv_namespaces]]
binding = "PANDORA_KV"
id = "43b018628433424b9ba41c01347c7330"

# R2: NSFW CG store (public-by-URL serving via GET /img?name=)
[[r2_buckets]]
binding = "R2_IMG"
bucket_name = "pandora-img"

[vars]
# Public push key only. VAPID_PRIVATE_JWK and AUTH_SECRET must be Worker secrets.
# Deploy with --keep-vars to preserve existing remotely configured values.
VAPID_PUBLIC = "BAwiI9sB57SF8E5gvYXTwVI811dqSP8AuafMxviofDaUw9SUYwmvdT2AyvFa6C6l21x0UXLl90pl2VOfGM3iVj0"
GOOGLE_CLIENT_ID = "888890730020-j136s19u4euq7sp0et4vb418b0mqar80.apps.googleusercontent.com"

# Atomic save revisions. SQLite-backed Durable Objects are available on Workers Free.
# This migration adds storage; it never deletes the legacy PANDORA_KV namespace.
[[durable_objects.bindings]]
name = "PANDORA_SYNC_STORE"
class_name = "PandoraSyncStore"

[[migrations]]
tag = "pandora-sync-v2-sqlite"
new_sqlite_classes = ["PandoraSyncStore"]
