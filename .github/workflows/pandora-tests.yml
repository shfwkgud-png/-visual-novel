name: Pandora regression tests
on:
  push:
    branches:
      - main
      - fix/pandora-turn-consistency-perf-20261111
      - fix/pandora-v360-state-recovery
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Pandora regression tests
        run: |
          node tests.js
          node tests-state-recovery.js
          node tests-summary.js
          node tests-background.js
