name: Pandora regression tests
on:
  push:
    branches:
      - main
      - fix/pandora-turn-consistency-perf-20261111
      - fix/pandora-v360-state-recovery
      - fix/pandora-v361-prompts-performance
      - fix/pandora-v362-api-diagnostics
      - fix/pandora-v363-sync-safety
      - fix/pandora-v364-free-output-budget
      - fix/pandora-v365-free-nemotron-profile
      - fix/pandora-v369-completion
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Pandora regression tests
        run: |
          node tests.js
          node tests-state-recovery.js
          node tests-summary.js
          node tests-background.js
          node tests-prompts.js
          node tests-provider.js
          node tests-settings.js
          node tests-draft.js
          node tests-sync-safety.js
          node tests-consistency.js
          node tests-consistency-integration.js
          node tests-long-session.js
          node tests-performance.js
          node tests-sync-worker.js
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Keep this version aligned with the npm package below. Browsers and system
    # dependencies are already in this official image, avoiding apt/DNS failures
    # on newly rolled runner images before any test can run.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install matching Playwright library
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Run offline browser and mobile scenarios
        run: node tests-browser.js
        env:
          PANDORA_BROWSER: ${{ matrix.browser }}
      - name: Save browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pandora-browser-${{ matrix.browser }}
          path: /tmp/pandora-browser
          if-no-files-found: ignore
